<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint Web App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Paint</h1>
      <p id="status" class="status" aria-live="polite"></p>
    </header>

    <section id="auth" class="auth" aria-label="Authentication">
      <div class="auth-card">
        <h2 id="auth-title">Create Account</h2>
        <p id="auth-subtitle" class="auth-subtitle">Start drawing and save your progress.</p>
        <form id="auth-form">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" required autocomplete="email" />

          <label for="auth-password">Password</label>
          <input id="auth-password" type="password" minlength="8" required autocomplete="new-password" />

          <button id="auth-submit" type="submit">Sign Up</button>
        </form>
        <div id="social-auth" class="social-auth hidden" aria-label="Social sign in">
          <button id="google-login" type="button" class="social-btn">Continue with Google</button>
        </div>
        <button id="forgot-password" class="link-button hidden" type="button">
          Forgot my password
        </button>
        <button id="auth-toggle" class="link-button" type="button">
          Already have an account? Sign in
        </button>
      </div>
    </section>

    <section id="paint" class="paint hidden" aria-label="Paint controls">
      <div class="toolbar">
        <label>
          Color
          <input id="color" type="color" value="#111111" />
        </label>

        <label>
          Size
          <input id="size" type="range" min="1" max="50" value="6" />
        </label>

        <button id="clear" type="button">Clear</button>
        <button id="save-png" type="button">Save PNG</button>
        <button id="save-cloud" type="button">Save Painting</button>
        <button id="signout" type="button">Sign Out</button>
      </div>

      <canvas id="canvas" width="900" height="520" aria-label="Drawing canvas"></canvas>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
