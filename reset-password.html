<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app reset-shell">
    <header class="app-header">
      <h1>Reset Password</h1>
      <p id="status" class="status" aria-live="polite"></p>
    </header>

    <section class="auth" aria-label="Reset password">
      <div class="auth-card">
        <h2>Set a New Password</h2>
        <p class="auth-subtitle">Enter your new password to continue.</p>
        <form id="reset-form">
          <label for="new-password">New Password</label>
          <input id="new-password" type="password" minlength="8" required autocomplete="new-password" />

          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password" />

          <button type="submit">Reset Password</button>
        </form>
        <a class="link-button" href="/">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="reset-password.js"></script>
</body>
</html>
